name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run library unit tests
        run: ./gradlew :verticalticker:testReleaseUnitTest --console=plain

      - name: Build release aar
        run: ./gradlew :verticalticker:assembleRelease -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Rename artifacts for the release
        run: |
          mkdir -p release-artifacts
          cp verticalticker/build/outputs/aar/verticalticker-release.aar \
            release-artifacts/verticalticker-${{ steps.version.outputs.version }}.aar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
